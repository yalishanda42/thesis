name: engine-release
on:
  push:
    tags: ["engine-v*"]

permissions:
  contents: write

jobs:
  # Create the release ONCE up front. The matrix jobs below then upload their
  # asset to this already-existing release, which avoids the race where parallel
  # softprops/action-gh-release calls each try to CREATE the same release (one
  # then fails its upload). Parallel uploads of distinct filenames are fine.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-14, key: macos-arm64}
          - {os: windows-latest, key: windows-x64}
          - {os: ubuntu-latest, key: linux-x64}
          # macos-x86_64 (Intel) is omitted: GitHub's macos-13 runners are
          # deprecated/scarce and block releases. Apple Silicon is covered by
          # macos-arm64. Re-add `{os: macos-13, key: macos-x86_64}` if Intel
          # Mac support is needed and runners are available.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install
        shell: bash
        run: |
          # CPU-only torch on Linux/Windows: the default wheels bundle ~2 GB of
          # CUDA libs the engine never uses (CPU single-request inference), which
          # blows past GitHub's 2 GiB release-asset limit. macOS wheels are CPU
          # already. Install torch first so the editable install below reuses it.
          if [ "${{ runner.os }}" != "macOS" ]; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install -e "ml[packaging]"
      - name: Fetch weights
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}   # optional; only needed if the model repos are private
        run: python ml/packaging/fetch_weights.py --out data/processed
      - name: Version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#engine-v}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: python ml/packaging/build_engine.py --version ${{ steps.ver.outputs.version }}
      - name: Smoke test
        run: python ml/packaging/smoke_test.py ml/packaging/dist/dn-engine
      - name: Upload engine to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ml/packaging/dist/dn-engine-*-${{ matrix.key }}.zip

  checksums:
    needs: build
    # Run even if a single platform build failed, so the release still gets a
    # SHA256SUMS covering the platforms that did publish (the bootstrap fetches
    # one SHA256SUMS and matches by filename). Fails harmlessly if no zips exist.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: robinraju/release-downloader@v1
        with:
          tag: ${{ github.ref_name }}
          fileName: "dn-engine-*.zip"
      - name: Build combined SHA256SUMS
        run: sha256sum dn-engine-*.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: SHA256SUMS
